# 지식 그래프 통합·E2E 검증 전용 PostgreSQL·Redis·Neo4j다. 개발·운영 데이터와 분리한다.
# 데이터는 named volume에 저장해 재부팅·재생성 후에도 유지하고, Docker 재시작 시 자동으로 다시 띄운다.
# 테스트 스크립트가 docker exec로 container 이름을 직접 쓰므로 container_name을 고정한다.
name: work-os-graph-verification

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    container_name: workos-graph-verification-postgres
    environment:
      POSTGRES_DB: graph_kg_test
      POSTGRES_USER: graph_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}
    ports:
      - '127.0.0.1:${VERIFICATION_POSTGRES_PORT:-45432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graph_test -d graph_kg_test']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:8.2.10-alpine
    container_name: workos-graph-verification-redis
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    ports:
      - '127.0.0.1:${VERIFICATION_REDIS_PORT:-46380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  neo4j:
    image: neo4j:2025.09-community
    container_name: workos-graph-verification-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD가 필요합니다}
      # 이미지에 포함된 labs의 APOC Core jar를 설치한다.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      # 검증용 VM 자원을 넘지 않도록 메모리를 제한한다.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - '127.0.0.1:${VERIFICATION_NEO4J_BOLT_PORT:-47687}:7687'
      - '127.0.0.1:${VERIFICATION_NEO4J_HTTP_PORT:-47474}:7474'
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
