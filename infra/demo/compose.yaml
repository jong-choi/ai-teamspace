name: workos-demo

x-server: &server
  image: workos-demo-server:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG가 필요합니다}
  env_file:
    - ${DEMO_SECRETS_DIR:?DEMO_SECRETS_DIR가 필요합니다}/server.env
  restart: unless-stopped
  networks:
    - internal
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monorepo_erp_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d monorepo_erp_demo']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  redis-queue:
    image: redis:8.2.10-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - redis-queue-data:/data
    healthcheck: &redis-health
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 384m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  redis-cache:
    image: redis:8.2.10-alpine
    command:
      [
        redis-server,
        --save,
        '',
        --appendonly,
        'no',
        --maxmemory,
        128mb,
        --maxmemory-policy,
        allkeys-lfu,
      ]
    healthcheck: *redis-health
    mem_limit: 192m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  redis-collaboration:
    image: redis:8.2.10-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        128mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - redis-collaboration-data:/data
    healthcheck: *redis-health
    mem_limit: 192m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  neo4j:
    image: neo4j:2025.09-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD가 필요합니다}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 1536m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  garage:
    image: dxflrs/garage:v2.3.0
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET가 필요합니다}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID가 필요합니다}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY가 필요합니다}
      GARAGE_DEFAULT_BUCKET: monorepo-erp-demo
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 128m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  api:
    <<: *server
    mem_limit: 1536m
    depends_on:
      postgres: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      garage: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3200/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  jobs:
    <<: *server
    command: [node, dist/jobs/main.js]
    mem_limit: 512m
    depends_on:
      api: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  collaboration:
    <<: *server
    command: [node, dist/wiki/collaboration/main.js]
    mem_limit: 512m
    depends_on:
      api: { condition: service_healthy }
      redis-collaboration: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('node:net').connect(3202,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    image: workos-demo-gateway:${DEMO_IMAGE_TAG:?DEMO_IMAGE_TAG가 필요합니다}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 128m
    networks:
      internal:
      proxy:
        aliases: [workos-demo-gateway]
    depends_on:
      api: { condition: service_healthy }
      collaboration: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  migrate:
    <<: *server
    command: [npm, run, db:migrate]
    restart: 'no'
    profiles: [tools]

  seed:
    <<: *server
    working_dir: /app/demo
    env_file:
      - ${DEMO_SECRETS_DIR:?DEMO_SECRETS_DIR가 필요합니다}/seed.env
    command: [npm, run, seed]
    restart: 'no'
    profiles: [tools]

networks:
  internal:
  proxy:
    external: true
    name: npm-network

volumes:
  postgres-data:
  redis-queue-data:
  redis-collaboration-data:
  neo4j-data:
  garage-meta:
  garage-data:
