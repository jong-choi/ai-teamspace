# 로컬 개발·acceptance 전용 self-hosted Langfuse다. 운영 배포 구성이 아니다.
# 공식 docker-compose.yml(v4.45.1)을 기준으로 image를 exact version으로 고정하고,
# 모든 port를 loopback에만 열며, secret은 같은 디렉터리의 .env에서 필수로 읽는다.
name: work-os-langfuse

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${LANGFUSE_WEB_PORT:-3300}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}@postgres:5432/postgres
  SALT: ${SALT:?SALT가 필요합니다}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY가 필요합니다}
  TELEMETRY_ENABLED: 'false'
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD가 필요합니다}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD가 필요합니다}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD가 필요합니다}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH가 필요합니다}
  # 평가기가 판정 모델을 동시에 부르는 수다. 모델 공급자의 동시 호출 한도에 맞춘다.
  LANGFUSE_EVAL_EXECUTION_WORKER_CONCURRENCY: ${LANGFUSE_EVAL_EXECUTION_WORKER_CONCURRENCY:-1}
  LANGFUSE_LLM_AS_JUDGE_EXECUTION_WORKER_CONCURRENCY: ${LANGFUSE_EVAL_EXECUTION_WORKER_CONCURRENCY:-1}
  LANGFUSE_EVAL_EXECUTION_SECONDARY_QUEUE_PROCESSING_CONCURRENCY: ${LANGFUSE_EVAL_EXECUTION_WORKER_CONCURRENCY:-1}

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.45.1
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-env
    logging: *logging

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.45.1
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:${LANGFUSE_WEB_PORT:-3300}:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET가 필요합니다}
      # browser와 SDK가 media를 올리는 주소다. host에 연 MinIO port와 같아야 한다.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT:-3390}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # 로컬 조직·프로젝트·API key·첫 사용자를 시작 시 만든다. 이미 있으면 건너뛴다.
      LANGFUSE_INIT_ORG_ID: work-os-local
      LANGFUSE_INIT_ORG_NAME: AI Teamspace Local
      LANGFUSE_INIT_PROJECT_ID: work-os-agent
      LANGFUSE_INIT_PROJECT_NAME: AI Teamspace Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY가 필요합니다}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY가 필요합니다}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL이 필요합니다}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD가 필요합니다}
    logging: *logging

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.4.5.143
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD가 필요합니다}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging: *logging

  minio:
    # Chainguard 무료 image는 latest tag만 제공하므로 digest로 고정한다.
    image: cgr.dev/chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    restart: unless-stopped
    entrypoint: sh
    # langfuse bucket을 만든 뒤 server를 시작한다.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD가 필요합니다}
    ports:
      - 127.0.0.1:${LANGFUSE_MINIO_PORT:-3390}:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    logging: *logging

  redis:
    image: docker.io/redis:7.2.16-alpine
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH:?REDIS_AUTH가 필요합니다}
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ['CMD', 'redis-cli', '-a', '${REDIS_AUTH}', '--no-auth-warning', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10
    logging: *logging

  postgres:
    image: docker.io/postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요합니다}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  redis-data:
