  <title id="title">AIJR 시스템 아키텍처</title>
  <desc id="desc">
    Expo 클라이언트와 외부 AI가 NestJS API와 MCP로 업무 기능을 사용한다. 내장
    에이전트는 MCP를 통해 업무를 처리하고, PostgreSQL과 Redis에 실행 상태를
    저장한다. Outbox와 BullMQ 워커가 Neo4j 지식 그래프를 갱신하며, Hocuspocus가
    위키 공동 편집을 처리한다.
  </desc>
