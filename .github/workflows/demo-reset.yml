name: 데모 데이터 초기화

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 한국시간 매일 새벽 3시다.

permissions:
  contents: read

concurrency:
  group: workos-demo-deploy
  cancel-in-progress: false

jobs:
  reset:
    if: github.repository == 'jong-choi/monorepo-erp' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, workos-demo]
    timeout-minutes: 30
    environment: demo
    env:
      DEMO_DEPLOY_PATH: ${{ vars.DEMO_DEPLOY_PATH }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
    steps:
      - name: 초기화 설정 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 고정 버전
        with:
          persist-credentials: false

      - name: 현재 배포 이미지 확인
        run: |
          set -euo pipefail
          umask 077
          : "${DEMO_DEPLOY_PATH:?데모 배포 경로가 필요합니다}"
          : "${DEMO_DOMAIN:?데모 도메인이 필요합니다}"
          export DEMO_SECRETS_DIR="$DEMO_DEPLOY_PATH/.temp/deploy-demo"
          export DEMO_IMAGE_TAG=deployed
          for file in compose.env server.env seed.env; do
            test -s "$DEMO_SECRETS_DIR/$file" || { printf '필수 설정이 없습니다: %s\n' "$file" >&2; exit 1; }
          done
          mkdir -p .temp/deploy-demo
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          services = ['api', 'jobs', 'collaboration', 'gateway', 'postgres', 'redis-queue', 'redis-cache', 'redis-collaboration', 'neo4j', 'garage']
          overrides = {}
          for service in services:
              ids = subprocess.check_output(['docker', 'ps', '-aq', '--filter', 'label=com.docker.compose.project=workos-demo', '--filter', f'label=com.docker.compose.service={service}', '--filter', 'label=com.docker.compose.oneoff=False'], text=True).split()
              if len(ids) != 1:
                  raise RuntimeError(f'현재 데모 container를 확인하세요: {service}')
              image = subprocess.check_output(['docker', 'inspect', '--format', '{{.Image}}', ids[0]], text=True).strip()
              subprocess.run(['docker', 'image', 'inspect', image], check=True, stdout=subprocess.DEVNULL)
              overrides[service] = {'image': image, 'pull_policy': 'never'}
          for service in ['migrate', 'seed']:
              overrides[service] = overrides['api'].copy()
          Path('.temp/deploy-demo/reset-images.json').write_text(json.dumps({'services': overrides}))
          PY
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json config --quiet
          printf 'DEMO_SECRETS_DIR=%s\nDEMO_IMAGE_TAG=%s\n' "$DEMO_SECRETS_DIR" "$DEMO_IMAGE_TAG" >> "$GITHUB_ENV"

      - name: 데모 저장소 초기화
        run: |
          set -euo pipefail
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json down --volumes --remove-orphans
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json up --detach --wait --wait-timeout 300 postgres redis-queue redis-cache redis-collaboration neo4j garage
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json run --rm --no-deps migrate

      - name: 오늘 기준 시드와 앱 시작
        run: |
          set -euo pipefail
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json up --detach --wait --wait-timeout 300 api collaboration
          base_date=$(TZ=Asia/Seoul date +%F)
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json run --rm --no-deps -e "DEMO_BASE_DATE=$base_date" seed
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json up --detach --wait --wait-timeout 300 jobs gateway

      - name: 초기화 결과 확인
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://$DEMO_DOMAIN/healthz"
          curl --fail --silent --show-error --max-time 15 "https://$DEMO_DOMAIN/backend/"
          docker compose --project-name workos-demo --env-file "$DEMO_SECRETS_DIR/compose.env" -f infra/demo/compose.yaml -f .temp/deploy-demo/reset-images.json ps
